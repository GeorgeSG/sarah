- id: '1699306268852'
  alias: Printer · Toner warning
  description: ''
  trigger:
  - platform: numeric_state
    entity_id:
    - sensor.printer_black_toner_remaining
    below: 30
  condition: []
  action:
  - service: notify.all_phones
    data:
      title: 'Printer · Low toner '
      message: The printer's toner is below 30%.
  mode: single
- id: '1699306535213'
  alias: Printer · Drum warning
  description: ''
  trigger:
  - platform: numeric_state
    entity_id:
    - sensor.printer_drum_remaining_life
    below: 30
  condition: []
  action:
  - service: notify.all_phones
    data:
      title: Printer · Needs new drum
      message: The printer's drum lifespan is below 30%.
  mode: single
- id: '1699446647329'
  alias: Bathroom · Turn off fan
  description: ''
  trigger:
  - platform: state
    entity_id:
    - binary_sensor.bathroom_motion_occupancy
    to: 'off'
    for:
      hours: 0
      minutes: 15
      seconds: 0
  condition: []
  action:
  - service: fan.turn_off
    data: {}
    target:
      entity_id: fan.bathroom
  mode: single
- id: '1699735427094'
  alias: Front door · turn on lights
  description: ''
  trigger:
  - platform: state
    entity_id:
    - binary_sensor.front_door_contact
    to: 'on'
  condition: []
  action:
  - service: light.turn_on
    data: {}
    target:
      entity_id:
      - light.hallway_main
      - light.hallway_entrance
  mode: single
- id: '1751744496991'
  alias: Climate · AC · Reduce cooling at 4
  description: ''
  triggers:
  - trigger: time
    at: 04:00:00
  conditions:
  - condition: state
    entity_id: climate.toshiba_ac
    state: cool
  actions:
  - action: climate.set_temperature
    metadata: {}
    data:
      temperature: 23
    target:
      entity_id: climate.toshiba_ac
  - delay:
      hours: 0
      minutes: 0
      seconds: 3
      milliseconds: 0
  - action: climate.set_fan_mode
    metadata: {}
    data:
      fan_mode: auto
    target:
      entity_id: climate.toshiba_ac
  mode: single
