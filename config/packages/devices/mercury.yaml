template:
  - button:
      - name: Mercury · Start
        icon: mdi:power
        press:
          - service: wake_on_lan.send_magic_packet
            data:
              mac: !secret mercury_mac

automation:
  - alias: Mercury · Power on at 10am when guest mode enabled
    trigger:
      - platform: time
        at: "10:00:00"
    condition:
      condition: state
      entity_id: input_boolean.guest_mode
      state: "on"
    action:
      - service: button.press
        entity_id: button.mercury_start
      - service: notify.telegram
        data_template:
          title: "*Mercury · Powering on*"
          message: "11:00 · Powering Mercury on (guest mode enabled)"

  - alias: Mercury · Power off at 11pm when guest mode enabled
    trigger:
      - platform: time
        at: "23:00:00"
    condition:
      condition: state
      entity_id: input_boolean.guest_mode
      state: "on"
    action:
      - service: button.press
        entity_id: button.mercury_shutdown
      - service: notify.telegram
        data_template:
          title: "*Mercury · Powering off*"
          message: "23:00 · Powering Mercury off (guest mode enabled)"
