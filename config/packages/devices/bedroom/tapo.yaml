template:
  - switch:
    - default_entity_id: switch.tapo_bedroom
      name: Bedroom Camera
      state: "{{ is_state('switch.bedroom_privacy', 'off') }}"
      turn_on:
        - action: script.tapo_bedroom_on
      turn_off:
        - action: script.tapo_bedroom_off
      icon: "{%if is_state('switch.bedroom_privacy', 'off') %}\n  mdi:video\n{% else
        %}\n  mdi:video-off\n{% endif %}"


script:
  tapo_bedroom_toggle:
    sequence:
      - choose:
        - conditions: "{{ is_state('switch.bedroom_privacy', 'on') }}"
          sequence:
            - service: script.tapo_bedroom_off

        default:
          - service: script.tapo_bedroom_on

  tapo_bedroom_on:
    sequence:
      - service: switch.turn_off
        entity_id: switch.bedroom_privacy
      - service: select.select_option
        entity_id: select.bedroom_move_to_preset
        data:
          option: away


  tapo_bedroom_off:
    sequence:
      - service: select.select_option
        entity_id: select.bedroom_move_to_preset
        data:
          option: home
      - service: switch.turn_on
        entity_id: switch.bedroom_privacy
